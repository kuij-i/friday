[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "friday-assistant"
version = "0.1.0"
description = "A self-improving personal AI assistant that lives on your machine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0,<2",
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "psutil>=5.9",
]

[project.optional-dependencies]
voice = ["faster-whisper>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
friday = "friday.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.setuptools]
packages = ["friday", "friday.tools", "friday.channels", "friday.selfimprove"]
